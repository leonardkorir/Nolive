name: nolive_app
description: Main Flutter application for Nolive.
publish_to: none

version: 0.3.6+9

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  ffi: ^2.1.4
  flutter_secure_storage: ^9.2.4
  image_gallery_saver_plus: ^4.0.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.4.0
  window_manager: ^0.5.1
  screen_brightness: ^2.1.7
  floating: ^6.0.0
  flutter_inappwebview: ^6.1.5
  flutter_qjs:
    path: ../../third_party/flutter_qjs
  live_core:
    path: ../../packages/live_core
  live_hls_proxy:
    path: ../../packages/live_hls_proxy
  live_providers:
    path: ../../packages/live_providers
  live_player:
    path: ../../packages/live_player
  live_danmaku:
    path: ../../packages/live_danmaku
  live_storage:
    path: ../../packages/live_storage
  live_sync:
    path: ../../packages/live_sync
  mobile_scanner: ^7.2.0
  flutter_native_splash: ^2.4.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  http: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/js/
  fonts:
    - family: DroidSansFallback
      fonts:
        - asset: assets/fonts/DroidSansFallbackFull.ttf

flutter_launcher_icons:
  android: 'ic_launcher'
  ios: false
  # Legacy / non-adaptive full tile (bg + mark).
  image_path: 'assets/branding/nolive_android_icon.png'
  min_sdk_android: 23
  # Adaptive icons crop to circle/squircle — use a transparent-padded
  # foreground so the monogram stays centered and is not clipped.
  adaptive_icon_background: '#101316'
  adaptive_icon_foreground: 'assets/branding/nolive_android_icon_foreground.png'

flutter_native_splash:
  color: '#101316'
  image: assets/branding/nolive_android_splash.png
  android: true
  ios: false
  web: false
  # Android 12+ uses a separate circular icon path — feed the full 1024 mark
  # so it is not the low-res adaptive foreground that looks soft.
  android_12:
    color: '#101316'
    image: assets/branding/nolive_android_splash.png
    icon_background_color: '#101316'
