name: nolive
packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: |
      flutter analyze apps/main_app && \
      find packages -mindepth 2 -maxdepth 2 -name pubspec.yaml -print | sort | while IFS= read -r pubspec; do \
        pkg="$(dirname "$pubspec")"; \
        echo "==> analyzing $pkg"; \
        (cd "$pkg" && if grep -q 'sdk:.*flutter' pubspec.yaml 2>/dev/null; then flutter analyze .; else dart analyze .; fi) || exit 1; \
      done
    description: Run static analysis for the app and all packages.

  test:
    run: |
      (cd apps/main_app && flutter test) && \
      find packages -mindepth 2 -maxdepth 2 -name pubspec.yaml -print | sort | while IFS= read -r pubspec; do \
        pkg="$(dirname "$pubspec")"; \
        echo "==> testing $pkg"; \
        (cd "$pkg" && if grep -q 'sdk:.*flutter' pubspec.yaml 2>/dev/null; then flutter test; else dart test; fi) || exit 1; \
      done
    description: Run app and package tests.

  format:
    run: dart format apps packages
    description: Format all Dart sources in the workspace.
